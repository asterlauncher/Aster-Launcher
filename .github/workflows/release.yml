name: Publish Aster Launcher update

on:
  push:
    tags:
      - "app-v*"
    branches:
      - main
    paths:
      - "docs/releases/0.5.3.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Publish signed Windows update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v0.5.3
          releaseName: "Aster Launcher v0.5.3"
          releaseBody: |
            # Aster Launcher 0.5.3 — Secure Social Session Hotfix

            - Existing Social sessions are restored before anonymous sign-in cooldowns
            - Social refresh tokens are backed up with Windows DPAPI across launcher updates
            - Duplicate profile heartbeats and database requests are reduced
            - Minecraft names containing underscores work in player search
            - Player search uses a safe online-first database function
            - Unused stale installer identities can be reclaimed safely
            - Social connection errors now include an in-place Retry action

            This is a closed-alpha build for public testing. Minecraft: Java Edition must be owned separately.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false

      - name: Create signed update manifest
        shell: pwsh
        env:
          ASTER_UPDATE_PRIVATE_KEY: ${{ secrets.ASTER_UPDATE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          $tag = "app-v$version"
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $publishedInstaller = @(
            $release.assets |
              Where-Object { $_.name -match '_x64-setup\.exe$' }
          )
          if ($publishedInstaller.Count -ne 1) {
            throw "Exactly one published NSIS installer was expected."
          }
          node scripts/create-update-manifest.mjs `
            $installer.FullName `
            aster-update.json `
            $publishedInstaller[0].url
          gh release upload "app-v$version" aster-update.json --clobber
